- name: Ensure .ssh directory exists
  file:
    dest: ~/.ssh
    mode: 0700
    state: directory

- name: Install SSH keys
  copy:
    src: ~/.local/share/dotfiles-local/ssh/
    dest: ~/.ssh/
    mode: 0600
  failed_when: false

- name: Ensure SSH agent is running
  shell: |
    if [ -z "$SSH_AUTH_SOCK" ]; then
      echo "Starting ssh-agent"
      eval "$(ssh-agent -s)"
    fi
  failed_when: false

- name: Get SSH passphrase
  pause:
    prompt: Enter your SSH passphrase
    echo: no
  register: ssh_passphrase

- name: "Add SSH key to agent"
  expect:
    chdir: ~/.ssh
    command: ssh-add
    responses:
      passphrase: "{{ ssh_passphrase.user_input }}"
  failed_when: false

- name: "Configure persistent key storage"
  blockinfile:
    marker: "# {mark} Configure persistent key storage"
    path: ~/.ssh/config
    state: present
    create: yes
    block: |
      Host *
      UseKeychain yes
      AddKeysToAgent yess
      IdentityFile ~/.ssh/id_rsa
  failed_when: false

- name: Change dotfiles remote origin URL to use ssh
  shell: git remote set-url origin git@github.com:leorodriguesf/dotfiles.git
  args:
    chdir: ~/.local/share/dotfiles

- name: Change dotfiles-local remote origin URL to use ssh
  shell: |
    git remote set-url origin git@github.com:leorodriguesf/dotfiles-local.git
  args:
    chdir: ~/.local/share/dotfiles-local
