- name: Check if Docker is already installed
  shell: test -d /Applications/Docker.app
  failed_when: false
  register: docker_installed

- name: Install Docker
  when: docker_installed.rc != 0
  shell: |
    cd /tmp
    curl -LO "https://desktop.docker.com/mac/main/arm64/202017/Docker.dmg?utm_source=docker&utm_medium=webreferral&utm_campaign=docs-driven-download-mac-arm64&_gl=1*1an2gku*_ga*MjAwOTIzMTM5NS4xNzU1MzA1NTY2*_ga_XJWPQMJYHQ*czE3NTUzMDU1NjUkbzEkZzEkdDE3NTUzMDU5OTkkajYwJGwwJGgw"
    hdiutil attach Docker.dmg
    /Volumes/Docker/Docker.app/Contents/MacOS/install
    hdiutil detach /Volumes/Docker
    rm -rf Docker.dmg
