- name: Change appearance to Dark Mode
  shell: |
    osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'

- name: Automatically hide and show the Dock
  shell: defaults write com.apple.dock autohide -bool true

- name: Hide recent apps
  shell: defaults write com.apple.dock show-recents -bool false

- name: Disable text correction
  shell: |
    defaults write -g NSAutomaticSpellingCorrectionEnabled -bool false
    defaults write -g NSAutomaticQuoteSubstitutionEnabled -bool false
    defaults write -g NSAutomaticPeriodSubstitutionEnabled -bool false
    defaults write -g NSAutomaticDashSubstitutionEnabled -bool false
    defaults write -g NSAutomaticCapitalizationEnabled -bool false

- name: Remove apps from dock
  shell: |
    defaults write com.apple.dock persistent-apps -array
    defaults write com.apple.dock persistent-others -array
    dockutil --add /Applications/Launchpad.app --replacing 'Launchpad'
