- name: Check if Flameshot is already installed
  shell: test -d /Applications/flameshot.app
  failed_when: false
  register: flameshot_installed

- name: Install Rosetta (allow run Intel based code)
  shell: softwareupdate --install-rosetta --agree-to-license
  when: flameshot_installed.rc != 0

- name: Install flameshot
  homebrew_cask:
    name: flameshot
  when: flameshot_installed.rc != 0

- name: Open flameshot
  shell: open /Applications/flameshot.app
  tags: has-user-interaction

- pause:
    prompt: Allow flameshot on System Settings
  tags: has-user-interaction

- name: Run flameshot on startup
  shell:
    /Applications/flameshot.app/Contents/MacOS/flameshot config --autostart true
  tags: has-user-interaction
