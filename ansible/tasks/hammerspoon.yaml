- name: Check if Hammerspoon is already installed
  shell: test -d /Applications/Hammerspoon.app
  failed_when: false
  register: hammerspoon_installed

- name: Install Hammerspoon
  homebrew_cask:
    name: hammerspoon
  when: hammerspoon_installed.rc != 0

- name: Open Hammerspoon
  shell: open /Applications/Hammerspoon.app
  tags: has-user-interaction

- pause:
    prompt: Allow Hammerspoon on System Settings
  tags: has-user-interaction
