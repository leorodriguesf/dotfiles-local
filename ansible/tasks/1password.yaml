- name: Check if 1Password Desktop is already installed
  shell: test -d /Applications/1Password.app
  failed_when: false
  register: op_desktop_installed

- name: Install 1Password Desktop
  homebrew_cask:
    name: 1password
  when: op_desktop_installed.rc != 0

- name: Install 1Password CLI
  homebrew:
    name: 1password-cli

- pause:
    prompt:
      Turn on the 1Password desktop app integration
      (https://developer.1password.com/docs/cli/get-started/#step-2-turn-on-the-1password-desktop-app-integration)
  tags: has-user-interaction
