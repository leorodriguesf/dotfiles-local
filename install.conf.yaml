- defaults:
    link:
      create: true
      relink: true

- clean: ["~", "~/.config"]

- link:
    ~/.shell_local_before: shell_local_before
    ~/.shell_local_after: shell_local_after
    ~/.zshrc_local_before: zshrc_local_before
    ~/.zshrc_local_after: zshrc_local_after
    ~/.bashrc_local_before: bashrc_local_before
    ~/.bashrc_local_after: bashrc_local_after

    ~/.config/aerospace: aerospace
    ~/.hammerspoon: hammerspoon
    ~/.config/hammerspoon: hammerspoon

- shell:
    - [git submodule update --init --recursive, Installing submodules]

    - command: |
        ansible-playbook ansible/secrets.yaml
      description: Setting up your secret tools
      stdin: true
      stdout: true
      stderr: true

    - [op signin, "Check if 1Password is set"]

    - command: |
        op whoami 1>/dev/null && ansible-playbook ansible/playbook.yaml --tags base --vault-password-file <(vault-from-op)
      description: Installing base tools
      stdin: true
      stdout: true
      stderr: true

    - command: |
        op whoami 1>/dev/null && ansible-playbook ansible/playbook.yaml --tags workstation --vault-password-file <(vault-from-op)
      description: Setting up your workstation
      stdin: true
      stdout: true
      stderr: true
