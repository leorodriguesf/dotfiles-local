- defaults:
    link:
      create: true
      relink: true

- clean: ["~", "~/.config"]

- link:
    ~/.shell_local_before: shell_local_before
    ~/.shell_local_after: shell_local_after
    ~/.zshrc_local_before: zshrc_local_before
    ~/.zshrc_local_after: zshrc_local_after
    ~/.bashrc_local_before: bashrc_local_before
    ~/.bashrc_local_after: bashrc_local_after
    ~/.gitconfig_local: gitconfig_local
    ~/.npmrc: npmrc
    ~/.m2/settings.xml: settings.xml

    ~/.config/aerospace: aerospace
    ~/.hammerspoon: hammerspoon
    ~/.config/hammerspoon: hammerspoon

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - command: ./scripts/decrypt-from-gitattributes
      description: Decrypting files
      stdin: true
      stdout: true
      stderr: true
    - command:
        ansible-playbook ansible/playbook.yaml --ask-become-pass
        --skip-tags=has-user-interaction
      description: Setting up the rest of your computer
      stdin: true
      stdout: true
      stderr: true
