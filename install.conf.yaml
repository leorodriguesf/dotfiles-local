- defaults:
    link:
      create: true
      relink: true

- clean: ["~", "~/.config"]

- link:
    ~/.shell_local_before: shell_local_before
    ~/.shell_local_after: shell_local_after
    ~/.zshrc_local_before: zshrc_local_before
    ~/.zshrc_local_after: zshrc_local_after
    ~/.bashrc_local_before: bashrc_local_before
    ~/.bashrc_local_after: bashrc_local_after
    ~/.gitconfig_local: gitconfig_local
    ~/.shell_private: shell_private

    ~/.config/aerospace: aerospace
    ~/.hammerspoon: hammerspoon
    ~/.config/hammerspoon: hammerspoon

- shell:
    - [git submodule update --init --recursive, Installing submodules]

    - command: ./scripts/decrypt-vault-files
      description: Decrypting files
      stdin: true
      stdout: true
      stderr: true

    - command: |
        ansible-playbook ansible/playbook.yaml --tags base
      description: Installing base tools
      stdin: true
      stdout: true
      stderr: true

    - command: |
        ansible-playbook ansible/playbook.yaml --tags secrets
      description: Setting up your secret tools
      stdin: true
      stdout: true
      stderr: true

    - command: |
        ansible-playbook ansible/playbook.yaml --tags workstation --vault-password-file <(vault-from-op)
      description: Setting up your workstation
      stdin: true
      stdout: true
      stderr: true
